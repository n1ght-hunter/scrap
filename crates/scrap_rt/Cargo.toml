[package]
name = "scrap_rt"
version.workspace = true
edition.workspace = true

[lib]
# `rlib` is required so the generated Rust-interop anchor crate can depend on
# scrap_rt (cargo rejects depending on a pure staticlib). The `.lib`/`.a` is
# still emitted, so the standalone link path is unaffected.
crate-type = ["staticlib", "rlib"]

[features]
gc-debug = []
parking-lot = ["dep:parking_lot"]
rtmalloc = ["scrap_allocator/rtmalloc"]

[dependencies]
scrap_coroutine = { workspace = true }
scrap_allocator = { workspace = true }
parking_lot = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[lints]
workspace = true

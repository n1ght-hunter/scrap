version: 2
updates:
  - package-ecosystem: "cargo"
    # `tools/*` are detached workspaces with their own lockfiles, so the root
    # entry does not reach them.
    directories:
      - "/"
      - "/tools/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all-deps:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all-actions:
        patterns:
          - "*"
